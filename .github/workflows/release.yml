name: Build downloads

# One portable build per desktop platform, published to a release anyone can
# download without installing anything. Each OS is built on its own runner:
# electron-builder's Windows target needs rcedit and the macOS target needs
# hdiutil, neither of which cross-compiles.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # to publish the "latest" release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: release/Claudefield-*-windows.exe
            stale: '^Claudefield-.*-windows\.exe$'
            name: windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: release/Claudefield-*-linux.AppImage
            stale: '^Claudefield-.*-linux\.AppImage$'
            name: linux
          - os: macos-latest
            script: dist:mac
            artifact: release/Claudefield-*-mac-*.dmg
            stale: '^Claudefield-.*-mac-.*\.dmg$'
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the desktop app
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: Claudefield-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # The "latest" release always holds today's main, so anything that renames
      # a build — a version bump, most often — would otherwise leave the old
      # file sitting beside the new one for someone to download by mistake.
      # Each job clears only its own platform's leftovers and never touches a
      # name it is about to upload, so the three jobs running in parallel
      # cannot delete each other's work.
      - name: Clear this platform's previous build off the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          built=(${{ matrix.artifact }})
          if [ ${#built[@]} -eq 0 ]; then
            echo "nothing built, nothing to clear"
            exit 0
          fi
          keeping=" "
          for f in "${built[@]}"; do keeping="$keeping$(basename "$f") "; done
          echo "uploading:$keeping"
          existing=$(gh release view latest --json assets --jq '.assets[].name' 2>/dev/null || true)
          for name in $existing; do
            if ! echo "$name" | grep -qE '${{ matrix.stale }}'; then continue; fi
            case "$keeping" in *" $name "*) continue ;; esac
            echo "removing stale asset $name"
            gh release delete-asset latest "$name" -y || true
          done

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Claudefield — latest build
          body: >
            Rebuilt automatically from the tip of `main`. Download the file for
            your platform and run it — nothing to install. Windows: the .exe is
            unsigned, so SmartScreen shows a warning; choose "More info" then
            "Run anyway". macOS: right-click the app and choose Open the first
            time. Prefer not to download anything? Play in the browser:
            https://skystrikerr.github.io/project_armafield/
          make_latest: true
          files: ${{ matrix.artifact }}
