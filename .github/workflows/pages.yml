name: Deploy web version

# The browser build. Identical code to the desktop app — the Electron shell
# just wraps this same dist/ — so the web version is never a cut-down port.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Pages has to be switched on once by hand, under
      # Settings → Pages → Build and deployment → Source: GitHub Actions. The
      # action can do it itself with enablement:true, but only with a token
      # that may administer the repository — the workflow's own GITHUB_TOKEN
      # cannot, and fails the run with "Resource not accessible by
      # integration". Every push after that one click deploys on its own.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
