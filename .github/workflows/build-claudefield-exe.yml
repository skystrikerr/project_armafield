name: Build Claudefield.exe

# Same approach as build-exe.yml (Thronglets): a real windows-latest runner
# rather than cross-compiling, since electron-builder's Windows target needs
# rcedit, a native Windows tool.
on:
  push:
    branches: [main]
    paths:
      - "src/ironfront/**"
      - "src/Ironfront.tsx"
      - "src/ironfront-main.tsx"
      - "electron/claudefield-main.cjs"
      - "ironfront.html"
      - "electron-builder.claudefield.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-claudefield-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write # to publish the "latest-claudefield" release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the portable .exe
        run: npm run dist:claudefield:win

      - uses: actions/upload-artifact@v4
        with:
          name: Claudefield-windows
          path: release/Claudefield-*-win.exe
          if-no-files-found: error

      # A distinct tag from Thronglets' "latest" release, so the two desktop
      # apps each keep their own stable download link without clobbering
      # each other.
      - name: Publish to the "latest-claudefield" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-claudefield
          name: Claudefield — latest build
          body: >
            Automatically rebuilt from the tip of main. This is not a
            versioned release — it is always today's `main`.
          make_latest: false
          files: release/Claudefield-*-win.exe
